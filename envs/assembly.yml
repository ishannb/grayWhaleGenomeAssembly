name: gw_assembly
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - flye>=2.9.4             # Kolmogorov et al. 2019
  - minimap2>=2.26          # Li 2018; needed by medaka and purge_dups
  - samtools>=1.19
  - seqkit>=2.7.0
  - filtlong>=0.2.1         # Wick 2021
  - purge_dups>=1.2.6       # Guan et al. 2020
  - busco>=5.7.1            # Simao et al. 2015
  - quast>=5.2.0            # Gurevich et al. 2013
  - pigz
  - pyyaml
  # Medaka installed separately via install_medaka.sh after env creation
  # because v2.2.x requires torch~=2.9 which is not yet on conda-forge
 
